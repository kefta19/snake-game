 
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
</head>
<body>
<script>
let snake, food, scl = 20, score = 0;
const letters = ['I',' ','a','m',' ','k', 'e', 'f', 't', 'a',' ','m','y',' ','f','r','i','s','t',' ','g','a','m','e'];
function setup() {
  createCanvas(800, 500);  
  frameRate(7);
  snake = new Snake();
  spawnFood();
}
function draw() {
  background(1 );
  if (snake.eat(food)) {
    snake.total++;
    score++;
    spawnFood();
  }
  snake.update();
  snake.show();
  fill(300, 0, 3);
  rect(food.x * scl, food.y * scl, scl, scl);
  fill(150);
  textSize(30);
  text(`Score: ${score}`, 10, 30);
}
function spawnFood() {
  food = createVector(floor(random(width / scl)), floor(random(height / scl)));
}
function keyPressed() {
  if (keyCode === UP_ARROW && snake.yspeed !== 1) snake.dir(0, -1);
  else if (keyCode === DOWN_ARROW && snake.yspeed !== -1) snake.dir(0, 1);
  else if (keyCode === LEFT_ARROW && snake.xspeed !== 1) snake.dir(-1, 0);
  else if (keyCode === RIGHT_ARROW && snake.xspeed !== -1) snake.dir(1, 0);
}
class Snake {
  constructor() {
    this.x = floor(width / scl / 2);
    this.y = floor(height / scl / 2);
    this.xspeed = 1;
    this.yspeed = 0;
    this.total = 0;
    this.tail = [];
  }
  update() {
    if (this.total === this.tail.length) {
      for (let i = 0; i < this.tail.length - 1; i++) this.tail[i] = this.tail[i + 1];
    }
    this.tail[this.total - 1] = createVector(this.x, this.y);
    this.x += this.xspeed;
    this.y += this.yspeed;
    if (this.x < 0 || this.x >= width / scl || this.y < 0 || this.y >= height / scl) {
      alert("Game Over");
      this.reset();
      spawnFood();
    } else if (this.checkCollision()) {
      alert("Game Over");
      this.reset();
      spawnFood();
    }
  }
  reset() {
    this.total = 0;
    this.tail = [];
    this.x = floor(width / scl / 2);
    this.y = floor(height / scl / 2);
    this.xspeed = 1;
    this.yspeed = 0;
    score = 0;
  }
  show() {
    fill(255);
    textSize(12);
    textAlign(CENTER, CENTER);
    for (let i = 0; i < this.tail.length; i++) {
      rect(this.tail[i].x * scl, this.tail[i].y * scl, scl, scl);
      fill(0);
      text(letters[(letters.length - 1 - (this.tail.length - i)) % letters.length], this.tail[i].x * scl + scl / 2, this.tail[i].y * scl + scl / 2);
      fill(255);
    }
    this.drawHead();
  }
  drawHead() {
    fill(255);
    let x = this.x * scl;
    let y = this.y * scl;
    let s = scl / 2;
    push();
    translate(x + s, y + s);
    if (this.xspeed === 1) triangle(-s, -s, -s, s, s, 0); // Right
    else if (this.xspeed === -1) triangle(s, -s, s, s, -s, 0); // Left
    else if (this.yspeed === 1) triangle(-s, -s, s, -s, 0, s); // Down
    else if (this.yspeed === -1) triangle(-s, s, s, s, 0, -s); // Up
    pop();
    fill(0);
    text(letters[(letters.length - 1 - this.tail.length) % letters.length], x + scl / 2, y + scl / 2);
    fill(255);
  }
  dir(x, y) {
    this.xspeed = x;
    this.yspeed = y;
  }
  eat(pos) {
    return dist(this.x, this.y, pos.x, pos.y) < 1;
  }
  checkCollision() {
    for (let i = 0; i < this.tail.length; i++) {
      if (dist(this.x, this.y, this.tail[i].x, this.tail[i].y) < 1) return true;
    }
    return false;
  }
}
</script>
</body>
</html>
